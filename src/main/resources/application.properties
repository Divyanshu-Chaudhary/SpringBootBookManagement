spring.application.name=bootrestbook

spring.datasource.name=springboottest
spring.datasource.url=jdbc:mysql://localhost:3306/springboottest
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# multipart configuration
#enabling multipart file upload
spring.servlet.multipart.enabled=true
# maximum file size
spring.servlet.multipart.max-file-size=100MB
# threshold after which files will be written to disk
spring.servlet.multipart.file-size-threshold=2KB 
